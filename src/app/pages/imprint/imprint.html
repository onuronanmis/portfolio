<section class="legal-page">
  <div class="legal-content">
    <app-back class="legal-back" />
    <div class="legal-title">
      <h1 class="legal-heading">{{ 'legalNotice.title' | translate }}</h1>
      <span class="legal-line"></span>
    </div>
    @for (sectionKey of sectionKeys; track sectionKey) {
      <div class="legal-block">
        <h2 class="legal-subheading">{{ 'legalNotice.sections.' + sectionKey + '.title' | translate }}</h2>
        <p class="legal-text">{{ 'legalNotice.sections.' + sectionKey + '.text' | translate }}</p>
      </div>
    }
  </div>
</section>
