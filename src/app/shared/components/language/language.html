<div class="language-switch" [class.language-text]="textMode()">
  @for (languageCode of languageCodes; track languageCode; let isLast = $last) {
    <button
      type="button"
      class="language-button"
      [class.language-active]="activeLanguage() === languageCode"
      (click)="changeLanguage(languageCode)">
      {{ languageCode.toUpperCase() }}
    </button>
    @if (textMode() && !isLast) {
      <span class="language-divider">/</span>
    }
  }
</div>
